spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/catalogo}
spring.datasource.username=${DB_USERNAME:catalogo}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.wposs.catalogo=DEBUG
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}
catalogo.swagger-publico=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
