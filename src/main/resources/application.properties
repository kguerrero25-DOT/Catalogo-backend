spring.application.name=catalogo
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5433/catalogo
spring.datasource.username=catalogo
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
logging.level.com.wposs.catalogo=DEBUG
catalogo.iva=0.19
app.jwt.secreto=${JWT_SECRETO}
app.jwt.duracion-ms=3600000
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}
