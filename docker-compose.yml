services:
  postgres:
    image: postgres:16
    container_name: catalogo-db
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catalogo}
      POSTGRES_DB: catalogo
    ports:
      - "5432:5432"
    volumes:
      - catalogo_pgdata:/var/lib/postgresql/data
volumes:
  catalogo_pgdata:
